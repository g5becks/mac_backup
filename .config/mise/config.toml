[settings]
experimental = true

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────────────
node   = "lts"
bun    = "latest"
deno   = "latest"
python = "stable"
uv     = "latest"
go     = "latest"
rust   = "stable"
lua    = "stable"
java   = "stable"
herdr  = "latest"
neovim = "latest"

# ── Shell & Navigation ─────────────────────────────────────────────────────────
"cargo:starship"      = "latest"
"cargo:zoxide"        = "latest"
"cargo:eza"           = "latest"
"cargo:bat"           = "latest"
"cargo:fd-find"       = "latest"    # binary is fd
"cargo:ripgrep"       = "latest"    # binary is rg
"cargo:mcfly"         = "latest"
"cargo:yazi-fm"       = "latest"    # binary is yazi
"github:junegunn/fzf" = "latest"

# ── Git ───────────────────────────────────────────────────────────────────────
"github:jesseduffield/lazygit"        = "latest"
"cargo:git-delta"                     = "latest"    # binary is delta
gh                                    = "latest"
"go:github.com/evilmartians/lefthook" = "latest"

# ── LSP Servers (not covered by Mason — verify before removing) ────────────────
"cargo:harper"                         = "latest"
"npm:@ansible/ansible-language-server" = "latest"

# ── Go Dev Tools ───────────────────────────────────────────────────────────────
