[settings]
experimental = true

[tools]
# ── Runtimes ──────────────────────────────────────────────────────────────────
node   = "lts"
bun    = "latest"
deno   = "latest"
python = "stable"    # build failure was missing apt dev libs, not this version string — see setup.sh
uv     = "latest"
go     = "latest"
rust   = "stable"
lua    = "5.4.7"      # "stable" 404'd — not a valid version alias for this tool
java   = "21"          # "stable" gave "no metadata found" — not a valid alias here either
herdr  = "latest"
neovim = "latest"

# ── Shell & Navigation ─────────────────────────────────────────────────────────
"github:starship/starship"  = "latest"
"github:ajeetdsouza/zoxide" = "latest"
"github:eza-community/eza"  = "latest"
"github:sharkdp/bat"        = "latest"
"github:sharkdp/fd"         = "latest"    # binary is fd
"github:BurntSushi/ripgrep" = "latest"    # binary is rg
"github:cantino/mcfly"      = "latest"
"github:sxyazi/yazi"        = "latest"    # binary is yazi; crates.io release lacks required Lua plugin files
"github:junegunn/fzf"       = "latest"

# ── Git ───────────────────────────────────────────────────────────────────────
"github:jesseduffield/lazygit" = "latest"
"github:dandavison/delta"      = "latest"    # binary is delta
gh                               = "latest"
"go:github.com/evilmartians/lefthook" = "latest"

# ── Editors ───────────────────────────────────────────────────────────────────
"cargo:helix-term" = "latest"    # binary is hx; kept as keyboard-session fallback

# ── LSP Servers (not covered by Mason — verify before removing) ────────────────
"github:Automattic/harper"             = "latest"    # binary is harper-ls
"npm:@ansible/ansible-language-server" = "latest"

# ── Go Dev Tools ───────────────────────────────────────────────────────────────
"go:github.com/air-verse/air"                                 = "latest"
"go:github.com/fatih/gomodifytags"                           = "latest"
"go:gotest.tools/gotestsum"                                   = "latest"
"go:github.com/josharian/impl"                               = "latest"
"go:mvdan.cc/gofumpt"                                         = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint"  = "latest"
"go:golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow" = "latest"
"go:github.com/mark3labs/mcp-filesystem-server"              = "latest"
"go:github.com/isaacphi/mcp-language-server"                 = "latest"
"go:github.com/yuucu/todotui/cmd/todotui"                    = "latest"
"go:github.com/github/github-mcp-server"                     = "latest"
"github:goreleaser/goreleaser"                                = "latest"

# ── Python Tools ──────────────────────────────────────────────────────────────
# All pipx: entries already route through uv/uvx automatically since uv is installed above — no syntax change needed.
"github:astral-sh/ruff"  = "latest"
"pipx:djlint"            = "latest"
"pipx:posting"           = "latest"
"pipx:sourcery"          = "latest"
"pipx:textlsp"           = "latest"
"pipx:markitdown"        = "latest"
"pipx:basic-memory"      = "latest"
"pipx:howdoi"            = "latest"
"pipx:python-lsp-server" = "latest"

# ── System & TUI Tools ────────────────────────────────────────────────────────
"github:ClementTsang/bottom"         = "latest"    # binary is btm
"github:dalance/procs"               = "latest"
"github:denisidoro/navi"             = "latest"
"github:atanunq/viu"                 = "latest"    # prebuilt binary may lag current release
"github:tldr-pages/tlrc"             = "latest"
"github:jesseduffield/lazydocker"    = "latest"
"go:github.com/jorgerojas26/lazysql" = "latest"

# ── HTTP & API Tools ──────────────────────────────────────────────────────────
"github:Orange-OpenSource/hurl" = "latest"
"github:ducaale/xh"             = "latest"

# ── Command Runners ───────────────────────────────────────────────────────────
"go:github.com/go-task/task/v3/cmd/task" = "latest"
"github:sigoden/argc"                     = "latest"

# ── Formatters & Linters ──────────────────────────────────────────────────────
"github:JohnnyMorganz/StyLua"    = "latest"
"github:tamasfe/taplo"           = "latest"    # binary is taplo; verify asset resolves, has a history of broken links
"github:ast-grep/ast-grep"       = "latest"    # binary is sg
"npm:@biomejs/biome"             = "latest"
"go:github.com/google/yamlfmt/cmd/yamlfmt"      = "latest"
"github:koalaman/shellcheck"                     = "latest"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "latest"

# ── Docs & Search ─────────────────────────────────────────────────────────────
"github:thomasschafer/scooter" = "latest"
"github:yassinebridi/serpl"    = "latest"    # confirmed: README points to releases page
"npm:repomix"                   = "latest"
"npm:fx"                        = "latest"
"go:github.com/charmbracelet/glow" = "latest"

# ── Cloud & DB Tools ──────────────────────────────────────────────────────────
"go:github.com/hetznercloud/cli/cmd/hcloud" = "latest"
"go:github.com/xo/usql"                    = "latest"

# ── Shell Completion ──────────────────────────────────────────────────────────
"github:carapace-sh/carapace-bin"       = "latest"

# ── AI Tools ──────────────────────────────────────────────────────────────────
"cargo:aichat"           = "latest"    # heavy compile (tokio/reqwest/tls) — no prebuilt found, budget ~5min
"npm:@google/gemini-cli" = "latest"
"npm:@smithery/cli"      = "latest"

# ── Misc NPM ──────────────────────────────────────────────────────────────────
"npm:commitizen"            = "latest"
"npm:ibm-openapi-validator" = "latest"    # last run hit a trust-policy block on rollup@2.80.0 — investigate before excluding, see mise docs on trust_policy_excludes
"npm:npm-check-extras"      = "latest"
"npm:corepack"              = "latest"

# ── Cargo Extras — no confirmed prebuilt binaries, staying on cargo: ───────────
"cargo:basalt-tui"  = "latest"
"cargo:ck-search"   = "latest"
"cargo:lazyactions" = "latest"    # confirmed: git clone + make build only, no releases
"cargo:orly"        = "latest"
"cargo:todotxt-tui" = "latest"
"cargo:wrkflw"      = "latest"
