[mgr]
prepend_keymap = [
  { on = "M", run = "plugin toggle-pane max-preview", desc = "Maximize/restore preview pane" },
  { on = "f", run = "plugin jump-to-char", desc = "Jump to char" },
  { on = "l", run = "plugin smart-enter", desc = "Enter or open" },
  { on = "F", run = "plugin smart-filter", desc = "Smart filter" },
  { on = "cm", run = "plugin chmod", desc = "Chmod on selected" },
  { on = "p", run = "plugin smart-paste", desc = "Smart paste" },
  { on = "gr", run = "plugin cd-git-root", desc = "Jump to git root" },
  { on = "yp", run = "plugin relative-path", desc = "Copy relative path" },
]
