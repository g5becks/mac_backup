[mgr]
show_hidden = true
sort_by = "alphabetical"
sort_dir_first = true
linemode = "size_and_mtime"
ratio = [1, 3, 4]

[opener]
edit = [
  { run = 'hx "$@"', block = true, desc = "Edit in Helix" }
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/javascript", use = "edit" },
  { mime = "*/xml", use = "edit" },
  { mime = "inode/x-empty", use = "edit" },
  { mime = "*", use = "edit" },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
group = "vscode-git-colors"
url = "*"
run = "vscode-git-colors"

[[plugin.prepend_fetchers]]
group = "vscode-git-colors"
url = "*/"
run = "vscode-git-colors"